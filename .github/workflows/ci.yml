name: ci

# Base CI: checks only, no artifacts. Runs on every push to main + PRs.
#   - check-macos:               type-check, lint, and tests on the primary platform.
#   - check-linux / check-windows: compile-only guard that the shipped app still
#     builds cross-platform (per AGENTS.md). These prove it COMPILES — not that
#     Lirevo is functional there (os-integration is macOS-only with stubs
#     elsewhere; GPU backends ship separately — both are v2 milestones).
# The signed + notarized .dmg is produced by release.yml on a version tag.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app/src-tauri

      # No `version:` input — pnpm/action-setup reads pnpm@<ver> from the
      # `packageManager` field in package.json (single source of truth).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@nextest

      - name: Install deps
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: just check

      - name: Lint
        run: just lint

      - name: Tests
        run: just test

  check-cross-platform:
    name: check-${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
    steps:
      - uses: actions/checkout@v6

      # Tauri 2 Linux system deps + a C/C++ toolchain (cmake/clang) for the
      # vendored ggml CPU build and bindgen.
      #
      # The os-integration Linux backend (evdev hotkey, enigo paste, arboard
      # clipboard with wayland-data-control) needs NO extra system -dev packages
      # to COMPILE: evdev/enigo/x11rb/xkbcommon/wl-clipboard-rs have no build
      # scripts that link system libs, and wayland-sys uses its pure-Rust default
      # (no `client`/`dlopen` feature) so its pkg-config probe is skipped.
      # libxdo-dev below is already present and unrelated to enigo here (enigo's
      # X11 path is x11rb, pure Rust). See crates/os-integration/src/linux/.
      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev \
            build-essential cmake clang libclang-dev libasound2-dev

      # Windows MAX_PATH(260): the nested cargo target + cmake build paths
      # overflow it for the native ggml builds. A short target dir avoids it.
      - name: Use a short target dir (Windows, avoid MAX_PATH)
        if: runner.os == 'Windows'
        run: echo "CARGO_TARGET_DIR=C:\b" >> $env:GITHUB_ENV
        shell: pwsh

      # The parakeet-cpp build.rs uses the Ninja generator on Windows; Ninja
      # needs an MSVC dev environment (cl.exe on PATH) + ninja itself.
      - name: Setup MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja
        shell: pwsh

      # rust-toolchain.toml pins the channel; rustup on the runner honors it.
      # Check the SHIPPED app only. The root workspace also has Unix-only dev
      # tooling (the HTTP-over-unix-socket sidecar + lirevo-cli/prototype) that
      # is not part of the cross-platform app surface.
      - name: cargo check (shipped app)
        working-directory: app/src-tauri
        run: cargo check
