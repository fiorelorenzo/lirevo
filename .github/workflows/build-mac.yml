name: build-mac

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app/src-tauri

      # No `version:` input — pnpm/action-setup reads pnpm@<ver> from the
      # `packageManager` field in package.json (single source of truth).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@nextest

      - name: Install deps
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: just check

      - name: Tests
        run: just test

      # Base CI is checks only (no artifacts). The signed + notarized .dmg is
      # produced by the release workflow (.github/workflows/release.yml) on a tag.
