[workspace]
members = [
    "crates/inference-core",
    "crates/lirevo-cli",
    "crates/lirevo-prompts",
    "crates/audio-capture",
    "crates/os-integration",
    "crates/lirevo-prototype",
    "crates/lirevo-eval",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
authors = ["Lorenzo Fiore <tech@sencare.io>"]
repository = "https://github.com/fiorelorenzo/lirevo"

[profile.release]
lto = "thin"
codegen-units = 1
