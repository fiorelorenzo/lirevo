# Tauri package is intentionally standalone (not a member of the root workspace).
# See spec §1, "Workspace layout" decision.
[workspace]

[package]
name = "lirevo"
version = "0.9.1"
description = "Lirevo — local AI scribe and agent for macOS"
edition = "2021"

[lib]
name = "lirevo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["stream"] }
futures-util = "0.3"
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1"
arc-swap = "1"
once_cell = "1"
sys-locale = "0.3"
hound = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1.3"

inference-core    = { path = "../../crates/inference-core" }
resource-monitor  = { path = "../../crates/resource-monitor" }
audio-capture     = { path = "../../crates/audio-capture" }
os-integration    = { path = "../../crates/os-integration" }
lirevo-prompts    = { path = "../../crates/lirevo-prompts" }
num_cpus          = "1"

# STT/LLM engines. DYNAMIC backends (GGML_BACKEND_DL — ggml backends incl. Metal
# built as loadable modules) on macOS + Linux; STATIC on Windows, where DL is
# deferred (MSVC can't defer the direct ggml-cpu symbol refs at DLL link, so the
# parakeet DL build fails — and Windows isn't functional yet anyway).
#
# `parakeet-cpp-sys` / `llama-cpp-sys-2` are DIRECT deps on the DL targets so their
# `links` metadata (`DEP_PARAKEET_*` / `DEP_LLAMA_*`) reaches THIS crate's
# `build.rs` (cargo only forwards a `links` crate's `cargo:KEY=VALUE` to its DIRECT
# normal dependents). build.rs uses it to re-emit the runtime rpaths the final
# host binary needs (cargo doesn't propagate a sys crate's link-args) and to
# disambiguate the two engines' colliding ggml dylibs. Feature sets mirror the
# transitive resolution so cargo unifies and doesn't rebuild the native libs.

[target.'cfg(target_os = "macos")'.dependencies]
parakeet-cpp = { git = "https://github.com/fiorelorenzo/parakeet-cpp", rev = "27ce3bec9bcca1aa90110e2770c937df2c83d9eb", features = ["dynamic-backends"] }
parakeet-cpp-sys = { git = "https://github.com/fiorelorenzo/parakeet-cpp", rev = "27ce3bec9bcca1aa90110e2770c937df2c83d9eb", features = ["dynamic-backends"] }
llama-cpp-sys-2 = { version = "0.1.146", features = ["dynamic-backends", "metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
parakeet-cpp = { git = "https://github.com/fiorelorenzo/parakeet-cpp", rev = "27ce3bec9bcca1aa90110e2770c937df2c83d9eb", features = ["dynamic-backends"] }
parakeet-cpp-sys = { git = "https://github.com/fiorelorenzo/parakeet-cpp", rev = "27ce3bec9bcca1aa90110e2770c937df2c83d9eb", features = ["dynamic-backends"] }
llama-cpp-sys-2 = { version = "0.1.146", features = ["dynamic-backends"] }

# Windows: static parakeet (DL deferred); llama resolves static via inference-core.
[target.'cfg(target_os = "windows")'.dependencies]
parakeet-cpp = { git = "https://github.com/fiorelorenzo/parakeet-cpp", rev = "27ce3bec9bcca1aa90110e2770c937df2c83d9eb" }

# statvfs for the pre-flight disk-space check (models.rs); Windows has no
# equivalent wired up yet (not functional end-to-end regardless, see
# AGENTS.md "Platform support status") so the check is a no-op there.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
# In-process STT mock. Pulls in `stt::mock::MockModel` and lets the loader
# honour `LIREVO_DEV_USE_MOCK_STT=1`. Debug-only by design — release builds
# must never ship the canned-text path.
test-stt = []
