# Tauri package is intentionally standalone (not a member of the root workspace).
# See spec §1, "Workspace layout" decision.
[workspace]

[package]
name = "lirevo"
version = "0.4.0"
description = "Lirevo — local AI scribe and agent for macOS"
edition = "2021"

[lib]
name = "lirevo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["stream"] }
futures-util = "0.3"
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1"
once_cell = "1"
sys-locale = "0.3"
hound = "3"

inference-core    = { path = "../../crates/inference-core" }
audio-capture     = { path = "../../crates/audio-capture" }
os-integration    = { path = "../../crates/os-integration" }
lirevo-prompts    = { path = "../../crates/lirevo-prompts" }

# M4: STT migration to audiopipe. Pinned on our fork (fiorelorenzo/audiopipe)
# so we can ship streaming on the fork independently of the upstream PR cadence.
# Feature set for the macOS-first M4 build; Linux/Windows builds (v2) will
# add `directml` and `vulkan-ggml` via target-specific dependencies.
#
# Phase-2 (T8) re-enabled the `whisper` feature now that `whisper-rs` was
# dropped from `inference-core` — both packages link the native `whisper`
# library, so they couldn't coexist before.
audiopipe = { git = "https://github.com/fiorelorenzo/audiopipe", rev = "f00281ce48f9965c01623565d51d247b523d2656", default-features = false, features = [
    "parakeet",
    # `parakeet-mlx` disabled: pulls in mlx-sys 0.2 → vendored MLX 0.25.1,
    # whose Metal kernels fail to compile against Xcode 17 / macOS SDK 26
    # (`MTL_CONST constexpr` in program scope, `simd_shuffle_and_fill_up`
    # bf16 ambiguity). Apple Silicon still gets acceleration via the ONNX
    # parakeet engine + CoreML execution provider. Re-enable once the MLX
    # upstream patch + mlx-rs bump are merged or our org fork is ready.
    "qwen3-asr-ggml",
    "whisper",
    "metal",
    "coreml",
] }
# audiopipe enables `ort` with `default-features = false`, which strips the
# `std` feature it relies on (`SessionBuilder::commit_from_file` is gated on
# `std`) and also strips `download-binaries` (without which the linker fails
# with the deliberately-loud "add_ort_library_path_or_enable_feature_…"
# placeholder lib name). Cargo unifies features across the graph, so
# re-enabling both here lets audiopipe build + link without forking it.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "half", "download-binaries"] }

[features]
default = ["audiopipe-whisper"]
# Mirror flag for `audiopipe`'s `whisper` feature. The STT loader checks
# this with `cfg!(feature = ...)` to gate the whisper-large-v3-turbo
# catalog entry; keeping it as a local feature (instead of poking at
# `audiopipe`'s own feature flag) makes the gating switchable per build
# target if a future Linux/Windows lane wants to disable Whisper.
audiopipe-whisper = []
# Mirror flag for `audiopipe`'s `parakeet-mlx` feature (currently OFF
# upstream because mlx-sys 0.2 doesn't build on Xcode 17). When re-enabled,
# the catalog silently upgrades parakeet-tdt-0.6b-v3 to the -mlx variant on
# Apple Silicon. Off by default so debug + release stay buildable.
audiopipe-mlx = []
# In-process STT mock. Pulls in `stt::mock::MockModel` and lets the loader
# honour `LIREVO_DEV_USE_MOCK_STT=1`. Debug-only by design — release builds
# must never ship the canned-text path.
test-stt = []
