# Tauri package is intentionally standalone (not a member of the root workspace).
# See spec §1, "Workspace layout" decision.
[workspace]

[package]
name = "lirevo"
version = "0.4.0"
description = "Lirevo — local AI scribe and agent for macOS"
edition = "2021"

[lib]
name = "lirevo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["stream"] }
futures-util = "0.3"
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1"
once_cell = "1"
sys-locale = "0.3"

inference-core    = { path = "../../crates/inference-core" }
audio-capture     = { path = "../../crates/audio-capture" }
os-integration    = { path = "../../crates/os-integration" }
lirevo-prompts    = { path = "../../crates/lirevo-prompts" }
