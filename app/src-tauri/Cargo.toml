# Tauri package is intentionally standalone (not a member of the root workspace).
# See spec §1, "Workspace layout" decision.
[workspace]

[package]
name = "lirevo"
version = "0.6.0"
description = "Lirevo — local AI scribe and agent for macOS"
edition = "2021"

[lib]
name = "lirevo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["stream"] }
futures-util = "0.3"
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1"
arc-swap = "1"
once_cell = "1"
sys-locale = "0.3"
hound = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1.3"

inference-core    = { path = "../../crates/inference-core" }
resource-monitor  = { path = "../../crates/resource-monitor" }
audio-capture     = { path = "../../crates/audio-capture" }
os-integration    = { path = "../../crates/os-integration" }
lirevo-prompts    = { path = "../../crates/lirevo-prompts" }
num_cpus          = "1"

# STT backend: our own Rust bindings to mudler/parakeet.cpp (ggml).
# Metal auto-enabled on macOS by the binding's build.rs. dynamic-backends builds
# ggml backends (incl. Metal on macOS) as loadable modules (GGML_BACKEND_DL).
parakeet-cpp = { git = "https://github.com/fiorelorenzo/parakeet-cpp", rev = "27ce3bec9bcca1aa90110e2770c937df2c83d9eb", features = ["dynamic-backends"] }

# Direct deps on the two `links` sys crates so their `links` metadata
# (`DEP_PARAKEET_*` / `DEP_LLAMA_*`) is exposed to THIS crate's `build.rs`. Cargo
# only forwards a `links` crate's `cargo:KEY=VALUE` metadata to the build scripts
# of crates that DIRECTLY depend on it as a *normal* dependency — the host
# otherwise reaches them only transitively (via `parakeet-cpp` /
# `inference-core`), so the rpath/backends-dir metadata never arrives. We use
# that metadata in `build.rs` to re-emit the runtime rpaths the final host binary
# needs (cargo does NOT propagate a sys crate's own link-args to the binary) and
# to disambiguate the two engines' colliding ggml dylibs.
# Features mirror the transitive resolution so cargo unifies and does not rebuild
# the native libs a second time (both `dynamic-backends`; `metal` for llama on
# Apple Silicon, matching `inference-core`'s `llama-cpp-2` feature set). These are
# build-glue only; no Rust code in the host references them directly.
parakeet-cpp-sys = { git = "https://github.com/fiorelorenzo/parakeet-cpp", rev = "27ce3bec9bcca1aa90110e2770c937df2c83d9eb", features = ["dynamic-backends"] }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-sys-2 = { version = "0.1.146", features = ["dynamic-backends", "metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-sys-2 = { version = "0.1.146", features = ["dynamic-backends"] }

[features]
default = []
# In-process STT mock. Pulls in `stt::mock::MockModel` and lets the loader
# honour `LIREVO_DEV_USE_MOCK_STT=1`. Debug-only by design — release builds
# must never ship the canned-text path.
test-stt = []
