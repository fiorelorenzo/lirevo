<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Lirevo app icon: the SAME five-bar symmetric waveform mark as the menu-bar
       tray (scripts/gen-icons.sh), but drawn BOLD for the app/Dock icon so the
       bars stay crisp at large sizes (the tray geometry is thin — tuned for a
       44px monochrome template — and goes soft when shown big). Brand blue on a
       white squircle. Bars: width 110, pill ends, symmetric heights
       150/360/540/360/150 centered on y=512 (ratio 2.5:6:9:6:2.5, same envelope
       as the tray's "balanced ready" state). -->
  <rect width="1024" height="1024" rx="225" ry="225" fill="#ffffff"/>
  <g fill="#1577F0">
    <rect x="141" y="437" width="110" height="150" rx="55"/>
    <rect x="299" y="332" width="110" height="360" rx="55"/>
    <rect x="457" y="242" width="110" height="540" rx="55"/>
    <rect x="615" y="332" width="110" height="360" rx="55"/>
    <rect x="773" y="437" width="110" height="150" rx="55"/>
  </g>
</svg>
