<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Lirevo app icon: the brand waveform mark on a dark squircle. The mark
       mirrors the in-app logo (app/src/lib/components/Logo.svelte): six rounded
       bars in a rising-then-tapering envelope, filled with the brand
       blue -> violet gradient. Regenerate variants with scripts/gen-icons.sh. -->
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1577F0"/>
      <stop offset="1" stop-color="#8A63FE"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="225" ry="225" fill="#0a0a0c"/>
  <g fill="url(#wave)">
    <rect x="160" y="448" width="64" height="128" rx="32"/>
    <rect x="288" y="352" width="64" height="320" rx="32"/>
    <rect x="416" y="256" width="64" height="512" rx="32"/>
    <rect x="544" y="320" width="64" height="384" rx="32"/>
    <rect x="672" y="416" width="64" height="192" rx="32"/>
    <rect x="800" y="480" width="64" height="64" rx="32"/>
  </g>
</svg>
