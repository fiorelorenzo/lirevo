[package]
name = "os-integration"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSPasteboard",
    "NSPasteboardItem",
    "NSWorkspace",
    "NSRunningApplication",
    "NSScreen",
] }
objc2-application-services = "0.3"
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat"] }
objc2-foundation = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
arboard = "3"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Hotkey: read raw key transitions from /dev/input (works on X11 AND Wayland,
# unlike X-server grabs which can't bind a lone modifier).
evdev = "0.13"
# Synthetic Ctrl+V for pasteboard-style injection. XTEST on X11; Wayland
# backend is experimental/best-effort (see inject.rs caveats).
enigo = "0.6"
# Clipboard. The `wayland-data-control` feature gives clipboard access under
# Wayland via the wlr-data-control protocol (in addition to X11).
arboard = { version = "3", features = ["wayland-data-control"] }
