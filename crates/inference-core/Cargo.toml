[package]
name = "inference-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "time", "sync"] }
axum = "0.8"
hyper = { version = "1.5", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.5"
async-trait = "0.1"
thiserror = "2"
hound = "3"
# M4: STT goes through audiopipe (same git pin as the Tauri host crate).
# Feature set matches `app/src-tauri/Cargo.toml`; with whisper-rs gone, the
# `whisper` feature on audiopipe can stay enabled here too.
audiopipe = { git = "https://github.com/fiorelorenzo/audiopipe", rev = "d63cf3ae40094cf0627823eaebde9102b3390cae", default-features = false, features = [
    "parakeet",
    # `parakeet-mlx` disabled: mlx-sys 0.2 / vendored MLX 0.25.1 doesn't
    # compile against Xcode 17 / macOS SDK 26 Metal Toolchain (MTL_CONST
    # constexpr + simd_shuffle_and_fill_up bf16 ambiguity). Keep in sync
    # with app/src-tauri/Cargo.toml — feature unification across the
    # workspace means enabling it here would re-pull mlx-sys for everyone.
    "qwen3-asr-ggml",
    "whisper",
    "metal",
    "coreml",
] }
# audiopipe enables `ort` with `default-features = false`, which strips the
# `std` feature it relies on and `download-binaries` needed for linking.
# Re-enable both here so the workspace resolves the same feature set the
# Tauri host uses.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "half", "download-binaries"] }
llama-cpp-2 = { version = "0.1", features = ["metal"] }
num_cpus = "1"

[dev-dependencies]
tempfile = "3"
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio", "http1"] }
http-body-util = "0.1"
hyperlocal = "0.9"
libc = "0.2"
