[package]
name = "inference-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "time", "sync"] }
axum = "0.8"
hyper = { version = "1.5", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.5"
async-trait = "0.1"
thiserror = "2"
hound = "3"
# M4: STT goes through audiopipe (same git pin as the Tauri host crate).
# Feature set matches `app/src-tauri/Cargo.toml`; with whisper-rs gone, the
# `whisper` feature on audiopipe can stay enabled here too.
audiopipe = { git = "https://github.com/fiorelorenzo/audiopipe", rev = "d4ef5d7681d52c0459ac0f5e186ca54085c46eb0", default-features = false, features = [
    "parakeet",
    # `parakeet-mlx` re-disabled 2026-05-26: full Tauri bundle build hits the
    # Xcode 26 Metal kernel errors. ONNX+CoreML path covers Apple Silicon.
    "qwen3-asr-ggml",
    "whisper",
    "metal",
    "coreml",
] }
# audiopipe enables `ort` with `default-features = false`, which strips the
# `std` feature it relies on and `download-binaries` needed for linking.
# Re-enable both here so the workspace resolves the same feature set the
# Tauri host uses.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "half", "download-binaries", "tls-native"] }
# M5: LLM cleanup runtime is mistral.rs, pinned at our fork. The fork branch
# `feat/gguf-gemma4` carries a Gemma 4 GGUF backend authored as upstream PR
# #2172 / RFC #2171; the dispatcher and Apple Silicon Metal kernels mistral.rs
# already ships work unchanged for the existing Lirevo catalog (Qwen3-4B,
# Llama-3.2-3B, Qwen3-1.7B, Gemma-3-1B, Gemma-3-270M). The Gemma 4 catalog
# entry will land in a follow-up commit once #2172 merges upstream and we
# smoke-test real Gemma 4 E2B-it weights.
mistralrs = { git = "https://github.com/fiorelorenzo/mistral.rs", rev = "fe997f130a47d080509f546a9ad2624f6ec9d034", default-features = false, features = ["metal"] }
num_cpus = "1"

[dev-dependencies]
tempfile = "3"
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio", "http1"] }
http-body-util = "0.1"
hyperlocal = "0.9"
libc = "0.2"
