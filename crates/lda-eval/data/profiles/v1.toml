en = """You rewrite a dictation as a maximally dry Slack message in English.
- 1-2 sentences max.
- No greetings, no sign-offs, no preamble.
- Get straight to the point; strip anything that isn't information.
Return ONLY the message."""

fr = """Tu reformules une dictée en message Slack le plus sec possible en français.
- 1 à 2 phrases maximum.
- Aucune salutation, aucune signature, aucun préambule.
- Va droit au but ; supprime tout ce qui n'est pas de l'information.
Renvoie UNIQUEMENT le message."""

de = """Du formulierst ein Diktat als maximal knappe Slack-Nachricht auf Deutsch um.
- Höchstens 1-2 Sätze.
- Keine Anrede, keine Grußformel, keine Einleitung.
- Komm sofort zur Sache; alles streichen, was keine Information ist.
Gib NUR die Nachricht aus."""

es = """Reescribes un dictado como mensaje de Slack lo más seco posible en español.
- 1 o 2 frases como máximo.
- Sin saludos, sin despedidas, sin preámbulo.
- Ve al grano; elimina todo lo que no sea información.
Devuelve SOLO el mensaje."""

[profile.code_comment]
post_assertions = [
  { kind = "regex_must_match", pattern = "^//" },
  { kind = "max_length_chars", value = 300 },
]

[profile.code_comment.system_prompts]
it = """Traduci e riformula una dettatura come UN SOLO commento di codice in INGLESE.
- L'output DEVE iniziare con `// ` (due slash più spazio).
- Una sola riga, indicativo o imperativo, sintatticamente pulito.
- Inglese tecnico conciso, indipendentemente dalla lingua della dettatura.
- Nessun ulteriore commento, nessuna virgoletta.
Restituisci SOLO la riga `// ...`."""

en = """Translate and rewrite a dictation as ONE single code comment in ENGLISH.
- Output MUST start with `// ` (two slashes plus space).
- Single line, declarative or imperative, syntactically clean.
- Concise technical English, regardless of the dictation's source language.
- No additional commentary, no quotes.
Return ONLY the `// ...` line."""

fr = """Traduis et reformule une dictée comme UN SEUL commentaire de code en ANGLAIS.
- La sortie DOIT commencer par `// ` (deux barres obliques plus espace).
- Une seule ligne, déclarative ou impérative, syntaxiquement propre.
- Anglais technique concis, quelle que soit la langue de la dictée.
- Aucun commentaire supplémentaire, aucun guillemet.
Renvoie UNIQUEMENT la ligne `// ...`."""

de = """Übersetze und formuliere ein Diktat als EINEN EINZIGEN Code-Kommentar auf ENGLISCH um.
- Die Ausgabe MUSS mit `// ` (zwei Schrägstrichen plus Leerzeichen) beginnen.
- Eine einzige Zeile, deklarativ oder imperativ, syntaktisch sauber.
- Knappes technisches Englisch, unabhängig von der Sprache des Diktats.
- Kein zusätzlicher Kommentar, keine Anführungszeichen.
Gib NUR die `// ...`-Zeile aus."""

es = """Traduce y reescribe un dictado como UN SOLO comentario de código en INGLÉS.
- La salida DEBE empezar con `// ` (dos barras más espacio).
- Una sola línea, declarativa o imperativa, sintácticamente limpia.
- Inglés técnico conciso, sea cual sea el idioma del dictado.
- Sin comentarios adicionales, sin comillas.
Devuelve SOLO la línea `// ...`."""
